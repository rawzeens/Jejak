# Xcode project for the iPhone app. Generate it with:  brew install xcodegen && xcodegen
name: Jejak
options:
  bundleIdPrefix: com.r4xn
  deploymentTarget:
    iOS: "17.0"
packages:
  JejakCore:
    path: JejakCore
targets:
  Jejak:
    type: application
    platform: iOS
    sources:
      - path: Jejak
    dependencies:
      - package: JejakCore
        product: JejakCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.r4xn.jejak
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Holds the one key Xcode can't set by itself: recording in the background.
        INFOPLIST_FILE: Jejak/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Jejak
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Jejak records where you go, every second, so it can show your day on a map. Your readings stay on this phone."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Jejak records where you go, every second, so it can show your day on a map. Your readings stay on this phone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  Jejak:
    build:
      targets:
        Jejak: all
